<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sensible GitHub</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #1f2328;
        background: #ffffff;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #d0d7de;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 600;
      }
      .section {
        padding: 12px 16px;
        border-bottom: 1px solid #d0d7de;
      }
      .section:last-child {
        border-bottom: none;
      }
      .site-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .site-name {
        font-size: 13px;
        color: #656d76;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toggle-switch {
        position: relative;
        width: 40px;
        height: 22px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #d0d7de;
        border-radius: 11px;
        transition: 0.2s;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      .toggle-switch input:checked + .toggle-slider {
        background-color: #1a7f37;
      }
      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(18px);
      }
      .warning {
        display: none;
        padding: 8px 12px;
        margin: 8px 0;
        background: #fff8c5;
        border: 1px solid #d4a72c;
        border-radius: 6px;
        font-size: 12px;
        color: #6a5d00;
      }
      .warning.visible {
        display: block;
      }
      .settings-section {
        padding: 12px 16px;
      }
      .settings-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: #656d76;
        margin-bottom: 8px;
      }
      .pat-input-group {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .pat-input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      .pat-input:focus {
        outline: none;
        border-color: #0969da;
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
      }
      .btn {
        padding: 6px 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #f6f8fa;
        color: #1f2328;
        transition: background 0.1s;
      }
      .btn:hover {
        background: #eaeef2;
      }
      .btn-primary {
        background: #1a7f37;
        color: #fff;
        border-color: #1a7f37;
      }
      .btn-primary:hover {
        background: #116329;
      }
      .btn-danger {
        color: #cf222e;
        border-color: #cf222e;
      }
      .btn-danger:hover {
        background: #fff1e5;
      }
      .pat-status {
        font-size: 12px;
        color: #656d76;
        margin-top: 4px;
      }
      .pat-status.success {
        color: #1a7f37;
      }
      .pat-status.error {
        color: #cf222e;
      }
      .not-available {
        font-size: 13px;
        color: #656d76;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Sensible GitHub</h1>
    </div>

    <div class="section">
      <div class="site-toggle">
        <div>
          <div>Enable on this site</div>
          <div class="site-name" id="siteName">-</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="siteToggle" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div id="tokenRequired" class="warning visible">
      A GitHub token is required. Add one below to enable Sensible GitHub.
    </div>

    <div id="tokenWarning" class="warning">
      Your GitHub token appears to be invalid. Update it below.
    </div>

    <div class="settings-section">
      <div class="settings-title">GitHub Token</div>
      <div class="pat-input-group">
        <input type="password" class="pat-input" id="patInput" placeholder="ghp_..." />
        <button class="btn btn-primary" id="savePat">Save</button>
        <button class="btn btn-danger" id="clearPat">Clear</button>
      </div>
      <div class="pat-status" id="patStatus"></div>
    </div>

    <div id="notAvailable" class="section" style="display: none;">
      <div class="not-available">Open a webpage to use Sensible GitHub</div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
